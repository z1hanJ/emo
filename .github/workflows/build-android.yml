name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release

env:
  ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
  ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
        
    - name: Set up Java 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq autoconf libtool pkg-config zlib1g-dev libssl-dev libffi-dev wget curl unzip zip libsdl2-dev
        pip install --upgrade pip setuptools wheel cython buildozer
        
    - name: Setup SDK with backward-compatible sdkmanager
      run: |
        SDK_DIR=$HOME/.buildozer/android/platform/android-sdk
        mkdir -p $SDK_DIR
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline.zip
        unzip -q /tmp/cmdline.zip -d /tmp/cmdline-extract
        mkdir -p $SDK_DIR/cmdline-tools/latest
        cp -r /tmp/cmdline-extract/cmdline-tools/* $SDK_DIR/cmdline-tools/latest/
        mkdir -p $SDK_DIR/tools/bin
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/sdkmanager $SDK_DIR/tools/bin/sdkmanager
        ln -sf $SDK_DIR/cmdline-tools/latest/bin/avdmanager $SDK_DIR/tools/bin/avdmanager
        cp -n $SDK_DIR/cmdline-tools/latest/bin/* $SDK_DIR/tools/bin/ 2>/dev/null || true
        mkdir -p $SDK_DIR/licenses
        echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_DIR/licenses/android-sdk-license
        echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_DIR/licenses/android-sdk-license
        echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $SDK_DIR/licenses/android-sdk-license
        echo "84831b9409646a918e30573bab4c9c91346d8abd" > $SDK_DIR/licenses/android-sdk-preview-license
        export PATH=$SDK_DIR/tools/bin:$SDK_DIR/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --sdk_root=$SDK_DIR --licenses 2>&1 || true
        sdkmanager --sdk_root=$SDK_DIR "platform-tools" 2>&1
        sdkmanager --sdk_root=$SDK_DIR "platforms;android-33" 2>&1
        sdkmanager --sdk_root=$SDK_DIR "build-tools;33.0.0" 2>&1
        
    - name: Install NDK 25b
      run: |
        NDK_DIR=$HOME/.buildozer/android/platform/android-ndk-r25b
        if [ ! -d "$NDK_DIR" ]; then
          wget -q https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d $HOME/.buildozer/android/platform/
        fi
        echo "NDK installed at: $NDK_DIR"
        
    - name: Build APK
      run: |
        set -eo pipefail
        export ANDROID_NDK_HOME=$HOME/.buildozer/android/platform/android-ndk-r25b
        export PATH=$ANDROID_HOME/tools/bin:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
        echo "=== Project files ==="
        ls -la buildozer.spec main.py data/ fonts/
        rm -rf .buildozer/app
        rm -rf .buildozer/android/platform/build-*
        rm -rf bin
        echo "=== Starting Build ==="
        buildozer android debug 2>&1 | tee /tmp/build.log
        echo "=== APK Search ==="
        mkdir -p /tmp/apk_out
        cp ./bin/*.apk /tmp/apk_out/ 2>/dev/null || true
        find .buildozer -name "*.apk" -exec cp {} /tmp/apk_out/ \; 2>/dev/null || true
        ls -la /tmp/apk_out/
        echo "=== Last 30 lines ==="
        tail -30 /tmp/build.log
        
    - name: Upload APK
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: MoodBot-APK
        path: /tmp/apk_out/*.apk
        retention-days: 30
        if-no-files-found: warn
        
    - name: Upload Build Log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: Build-Log
        path: /tmp/build.log
        retention-days: 7
        if-no-files-found: warn
